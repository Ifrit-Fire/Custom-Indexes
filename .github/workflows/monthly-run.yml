name: Monthly Index Build

on:
  schedule:
    - cron: '0 0 1 * *'  # Runs at midnight UTC on the 1st of every month
  workflow_dispatch:       # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    env:
      CMC_API_TOKEN: ${{ secrets.CMC_API_TOKEN }}
      FINN_API_TOKEN: ${{ secrets.FINN_API_TOKEN }}
      FMP_API_TOKEN: ${{ secrets.FMP_API_TOKEN }}
      FRED_API_TOKEN: ${{ secrets.FRED_API_TOKEN }}
      POLY_API_TOKEN: ${{ secrets.POLY_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run index builder
        run: python -m src.main

      # master only accepts changes through a pull request, so push the
      # build output to its own branch and open a PR for it.
      - name: Open pull request with updated indexes
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add indexes/
          if git diff --cached --quiet; then
            echo "No index changes to commit."
            exit 0
          fi
          today="$(date -u +'%Y-%m-%d')"
          branch="indexes/update-${today}"
          title="chore: update indexes [${today}]"
          git switch -c "$branch"
          git commit -m "$title"
          git push --force origin "$branch"
          gh pr view "$branch" > /dev/null 2>&1 || gh pr create --base master --head "$branch" \
            --title "$title" --body "Automated monthly index build."
